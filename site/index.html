<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matrice de compétences</title>
  <meta name="description" content="Matrice de compétences de l'équipe : référents, back-ups et résilience aux absences.">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <script>
    // Thème appliqué avant l'affichage : choix mémorisé, sinon réglage du système.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('matrice-competences.theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="app.css?v=__VERSION__">
  <script defer src="vendor/qrcode-generator-1.4.4.js?v=__VERSION__"></script>
  <script type="module" src="js/theme.js?v=__VERSION__"></script>
  <script type="module" src="js/app.js?v=__VERSION__"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand-block">
      <a class="eyebrow home-link" href="./">Matrice de compétences</a>
      <h1 class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="page-title">Matrice de compétences</span></h1>
    </div>
    <div class="topbar-actions">
      <div class="whoami" id="whoami" hidden>
        <label class="muted" for="me-select">Je suis</label>
        <select class="field" id="me-select"></select>
        <form class="inline-form" id="join-form" novalidate>
          <input class="field" id="join-name" name="name" placeholder="Ou ajouter mon nom" maxlength="30" autocomplete="name" autocapitalize="words" spellcheck="false" aria-label="Ajouter mon nom à l'équipe">
          <button class="button" type="submit">Ajouter</button>
        </form>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Passer en thème sombre" title="Passer en thème sombre">
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="banner" id="banner" role="status" hidden></div>

  <main class="wrap">
    <!-- Chargement / erreur bloquante -->
    <section class="screen" id="screen-status">
      <p class="status-text" id="status-text">Connexion…</p>
    </section>

    <!-- Accueil -->
    <section class="screen" id="screen-home" hidden></section>

    <!-- Équipe introuvable ou à la corbeille -->
    <section class="screen" id="screen-message" hidden></section>

    <!-- Matrice d'une équipe -->
    <section class="screen" id="screen-matrix" hidden>
      <div class="team-bar" id="team-bar"></div>
      <section class="summary" id="summary" aria-label="Synthèse"></section>
      <nav class="tabs" role="tablist" id="tabs" aria-label="Vues de la matrice"></nav>
      <div class="panel" id="panel" role="tabpanel"></div>
      <footer class="foot" id="foot"></footer>
    </section>
  </main>

  <dialog class="dialog" id="share-dialog" aria-labelledby="share-title">
    <h2 id="share-title">Partager l'équipe</h2>
    <p class="muted" id="share-team"></p>
    <div class="qr" id="share-qr"></div>
    <div class="share-link">
      <input class="field" id="share-url" readonly aria-label="Lien de l'équipe">
      <button type="button" class="button button-primary" id="share-copy">Copier le lien</button>
    </div>
    <p class="share-status" id="share-status" role="status"></p>
    <button type="button" class="button" id="share-close">Fermer</button>
  </dialog>

  <div class="toast" id="toast" role="alert" aria-live="assertive" hidden></div>
</body>
</html>
